name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: brew install ninja

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: pluginval
        run: scripts/pluginval.sh build 10

      - name: auval
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Cntr Mcon
